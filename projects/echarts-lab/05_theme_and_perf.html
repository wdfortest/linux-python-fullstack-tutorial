<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>自定义主题与大数据量优化</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  <script>
    if (typeof echarts === "undefined") {
      document.write('<script src="https://registry.npmmirror.com/echarts/6.1.0/files/dist/echarts.min.js"><\/script>');
    }
  </script>
  <style>
    body { font-family: "PingFang SC", sans-serif; max-width: 1000px; margin: 0 auto; padding: 24px; }
    .chart { width: 100%; height: 320px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
    .dark { background: #111827; }
    p { color: #6b7280; font-size: 13px; }
    h2 { margin-top: 28px; }
    #perf { color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body>
  <h1>进阶：主题 · 动画 · 大数据量</h1>

  <h2>① registerTheme 自定义主题（同一份数据换主题）</h2>
  <p>内置 dark 用 echarts.init(dom, "dark")；下面是 registerTheme 注册的品牌主题。</p>
  <div id="theme-light" class="chart"></div>
  <div id="theme-brand" class="chart dark"></div>

  <h2>② 大数据量：10 万点散点 + large/sampling + dataZoom</h2>
  <p>10 万个点，开启 <code>large: true</code> 与 <code>sampling</code>，拖动下方 dataZoom 体验。渲染耗时：<span id="perf">计算中…</span></p>
  <div id="big" class="chart"></div>

  <script>
    // ---- ① 自定义主题 ----
    echarts.registerTheme("brand", {
      backgroundColor: "#111827",
      textStyle: { color: "#e5e7eb" },
      color: ["#38bdf8", "#a78bfa", "#fbbf24", "#34d399", "#fb7185"],
      title: { textStyle: { color: "#f9fafb" } },
      legend: { textStyle: { color: "#9ca3af" } },
    });

    const makeBar = (id, theme) => {
      echarts.init(document.getElementById(id), theme).setOption({
        title: { text: "评分分布（示例）", left: "center" },
        tooltip: { trigger: "axis" },
        xAxis: { type: "category", data: ["1星", "2星", "3星", "4星", "5星"] },
        yAxis: { type: "value" },
        series: [{ type: "bar", data: [226, 196, 203, 179, 196], label: { show: true, position: "top" } }],
      });
    };
    makeBar("theme-light", undefined);   // 默认主题
    makeBar("theme-brand", "brand");     // 注册的品牌主题（深色）

    // ---- ② 10 万点散点 ----
    const N = 100000;
    const data = new Array(N);
    for (let i = 0; i < N; i++) {
      // 双峰混合分布，模拟真实数据形状
      const peak = i % 2 === 0 ? 25 : 45;
      data.push([
        +(peak + (Math.random() - 0.5) * 30).toFixed(2),
        Math.ceil(Math.random() * 5),
      ]);
    }
    const t0 = performance.now();
    const bigChart = echarts.init(document.getElementById("big"));
    bigChart.setOption({
      tooltip: { trigger: "item" },
      dataZoom: [{ type: "inside" }, { type: "slider" }],
      xAxis: { name: "价格 £", type: "value", min: 0, max: 65 },
      yAxis: { name: "评分", type: "value", min: 1, max: 5, splitNumber: 4 },
      series: [{
        type: "scatter", data,
        large: true,                       // 大数据量模式
        largeThreshold: 5000,
        symbolSize: 4,
        itemStyle: { opacity: 0.35, color: "#38bdf8" },
        progressive: 20000,                // 分批渲染，避免长任务卡顿
        progressiveThreshold: 50000,
      }],
    });
    document.getElementById("perf").textContent =
      (performance.now() - t0).toFixed(0) + " ms（" + N.toLocaleString() + " 点）";

    window.addEventListener("resize", () => {
      ["theme-light", "theme-brand", "big"].forEach((id) => {
        const inst = echarts.getInstanceByDom(document.getElementById(id));
        if (inst) inst.resize();
      });
    });
  </script>
</body>
</html>
