<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ECharts 快速上手 · 第一个柱状图</title>
  <!-- CDN 三选一：jsdelivr / unpkg / 国内 npmmirror -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  <script>
    if (typeof echarts === "undefined") {
      document.write('<script src="https://registry.npmmirror.com/echarts/6.1.0/files/dist/echarts.min.js"><\/script>');
    }
  </script>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; }
    .chart { width: 100%; height: 360px; border: 1px solid #e5e7eb; border-radius: 8px; }
    p { color: #6b7280; }
  </style>
</head>
<body>
  <h1>ECharts 快速上手</h1>
  <p>四步：给容器显式高度 → init → setOption → 窗口变化时 resize。</p>

  <h2>第一个柱状图：编程语言热度（示例数据）</h2>
  <div id="bar1" class="chart"></div>

  <h2>折线图：一周访问量（示例数据）</h2>
  <div id="line1" class="chart"></div>

  <script>
    // 1) init：DOM 就绪后初始化实例（脚本在 body 末尾，DOM 已就绪）
    const barChart = echarts.init(document.getElementById("bar1"));
    // 2) setOption：声明式描述「画什么」
    barChart.setOption({
      title: { text: "编程语言热度", subtext: "示例数据", left: "center" },
      tooltip: { trigger: "axis" },
      xAxis: { type: "category", data: ["Python", "JavaScript", "Java", "Go", "Rust"] },
      yAxis: { type: "value" },
      series: [{
        name: "热度",
        type: "bar",
        data: [92, 84, 70, 55, 40],
        itemStyle: { color: "#3b82f6", borderRadius: [4, 4, 0, 0] },
        label: { show: true, position: "top" },
      }],
    });

    const lineChart = echarts.init(document.getElementById("line1"));
    lineChart.setOption({
      title: { text: "一周访问量", subtext: "示例数据", left: "center" },
      tooltip: { trigger: "axis" },
      xAxis: { type: "category", data: ["周一", "周二", "周三", "周四", "周五", "周六", "周日"] },
      yAxis: { type: "value" },
      series: [{
        name: "访问量",
        type: "line",
        data: [820, 932, 901, 1290, 1330, 1520, 1420],
        smooth: true,
        lineStyle: { width: 3, color: "#10b981" },
        areaStyle: { opacity: 0.15 },
        markPoint: { data: [{ type: "max", name: "峰值" }] },
      }],
    });

    // 3) resize：窗口变化时让图表自适应
    window.addEventListener("resize", () => {
      barChart.resize();
      lineChart.resize();
    });
  </script>
</body>
</html>
